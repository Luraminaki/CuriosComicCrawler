[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curios-comic-crawler"
version = "0.6.0"
description = "Download Sequential Art comic pages and locally upscale them with OpenCV super-resolution models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luraminaki" }]
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "pydantic>=2.7",
    # Needed unconditionally, regardless of which upscale engine is selected: upscaler.py's
    # imread/imwrite and image_ops.py's posterise/sharpen steps (cv2.kmeans, cv2.GaussianBlur)
    # always run through cv2, on every page, after whichever engine produced the upscaled
    # image. The "contrib" variant specifically (not plain opencv-python) is required for the
    # "opencv" engine's cv2.dnn_superres module -- since cv2 is needed either way, there's no
    # download/disk saving in trying to make this an extra, only the risk of reintroducing the
    # opencv-python/opencv-contrib-python conflict documented in INSTALL.md (previously caused
    # by the now-removed ncnn engine's own opencv-python dependency; nothing left in this
    # project's dependency tree pulls in plain opencv-python anymore).
    "opencv-contrib-python>=4.9",
    # Powers the default "onnx" upscale engine (see sr_engine_onnx.py) with small models
    # bundled directly in this package -- lightweight and actively maintained, unlike the
    # ncnn-based engine this replaced, so it's a base dependency rather than an extra.
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "basedpyright>=1.40", "pytest>=8.0", "pylint>=3.3", "radon>=6", "vulture>=2.14"]
# Only needed to run tools/convert_onnx_model.py, which regenerates the bundled model in
# sr_engine_onnx.py's assets/ from the official PyTorch weights. Not needed to use the
# package -- onnxruntime (a base dependency) is all that's needed to run the already-converted,
# already-bundled model.
convert = ["torch>=2.0", "onnx>=1.14"]

[project.scripts]
comiccrawler = "curios_comic_crawler.cli_launcher:cli"
comiccrawler-download = "curios_comic_crawler.cli_download:cli"
comiccrawler-upscale = "curios_comic_crawler.cli_upscale:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/curios_comic_crawler"]

[tool.ruff]
# Lint against the oldest supported Python (see requires-python): newer syntax is flagged.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "PL", "N", "SIM", "RUF", "D", "PERF", "NPY",
    "TC",       # type-only imports under `if TYPE_CHECKING:`
]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
strict = true
# Pydantic evaluates field annotations at runtime.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Expected values in assertions are literals by nature.
"tests/*" = ["PLR2004"]

[tool.basedpyright]
include = ["src", "tests", "tools"]
venvPath = "."
venv = ".venv"
# Type-check against the oldest supported Python (see requires-python).
pythonVersion = "3.11"
typeCheckingMode = "recommended"
# Library typing gaps (numpy, OpenCV, onnxruntime, torch), not project code -- same choice
# as pyBones; plus lambdas given to `monkeypatch.setattr` (typed `Any`).
reportAny = "none"
reportExplicitAny = "none"
reportMissingTypeArgument = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
# `typing.override` only exists from Python 3.12; the package supports 3.11.
reportImplicitOverride = "none"

[tool.pylint.main]
# OpenCV is a C extension: let pylint load it to see its members.
extension-pkg-allow-list = ["cv2"]
# Only the `convert` extra (tools/) needs them; they aren't installed for normal use.
ignored-modules = ["torch", "onnx"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.similarities]
min-similarity-lines = 8

[tool.pylint."messages control"]
disable = [
    # Flags protocols, models and test fakes: data holders by design.
    "too-few-public-methods",
    # `assert x == []` makes pytest print the unexpected items; `assert not x` doesn't.
    "use-implicit-booleaness-not-comparison",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
